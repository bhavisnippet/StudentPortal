<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        body {
            background-color: rgb(255, 255, 255);
            margin: 0;
            padding: 0;
            height: 100vh;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 100px;
            height: 10vh;
        }

        nav h3 {
            font-size: 2rem;
            font-family: monospace;
            color: rgb(0, 0, 0);
            text-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        /* logout button  */
        .logout {
            display: inline-block;
            transition: all 0.2s ease-in;
            position: relative;
            overflow: hidden;
            z-index: 1;
            color: #090909;
            padding: 0.7em 1.7em;
            cursor: pointer;
            font-size: 18px;
            border-radius: 0.5em;
            background: #e8e8e8;
            border: 1px solid #e8e8e8;
            box-shadow: 6px 6px 12px #c5c5c5, -6px -6px 12px #ffffff;
        }

        .logout:active {
            color: #666;
            box-shadow: inset 4px 4px 12px #c5c5c5, inset -4px -4px 12px #ffffff;
        }

        .logout:before {
            content: "";
            position: absolute;
            left: 50%;
            transform: translateX(-50%) scaleY(1) scaleX(1.25);
            top: 100%;
            width: 140%;
            height: 180%;
            background-color: rgba(0, 0, 0, 0.05);
            border-radius: 50%;
            display: block;
            transition: all 0.5s 0.1s cubic-bezier(0.55, 0, 0.1, 1);
            z-index: -1;
        }

        .logout:after {
            content: "";
            position: absolute;
            left: 55%;
            transform: translateX(-50%) scaleY(1) scaleX(1.45);
            top: 180%;
            width: 160%;
            height: 190%;
            background-color: #ce0000;
            border-radius: 50%;
            display: block;
            transition: all 0.5s 0.1s cubic-bezier(0.55, 0, 0.1, 1);
            z-index: -1;
        }

        .logout:hover {
            color: #ffffff;
            border: 1px solid #ce0000;
        }

        .logout:hover:before {
            top: -35%;
            background-color: #ce0000;
            transform: translateX(-50%) scaleY(1.3) scaleX(0.8);
        }

        .logout:hover:after {
            top: -45%;
            background-color: #ce0000;
            transform: translateX(-50%) scaleY(1.3) scaleX(0.8);
        }

        /* Hero container  */
        .container {
            text-align: center;
            margin-top: 8%;
        }

        .container h1 {
            font-size: 7rem;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(90deg, #ff512f, #dd2476);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1;
        }

        /* Panel Style */
        .panel h3 {
            font-size: 2.5rem;
            font-family: monospace;
            text-align: center;
            margin-top: 90px;
            background-color: #090909;
            color: white;
            padding: 15px;
        }

        .panel .managebtn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
        }

        /*  buttons  */
        .panelBtn {
            padding: 15px 20px;
            border: none;
            outline: none;
            background-color: #ce0000;
            color: #eee;
            border-radius: 7px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease-out;
            font-size: 1.3rem;
            box-shadow: 6px 6px 12px #c5c5c5, -6px -6px 12px #ffffff;
        }

        .panelBtn:hover {
            background-color: #443f3f;
            transform: translateY(-3px);

        }
    </style>
</head>

<body>
    <nav>
        <h3>Welcome <span id="userName"></span> 👋</h3>
        <button class="logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </nav>
    <div class="profileInfo">
        <h2>Profile Information</h2>
        <p>Email: <span id="userEmail"></span></p>
        <p>Phone: <span id="userPhone"></span></p>
    </div>
    <div class="container">
        <h1>Bhavi Digital<br />Student Portal!</h1>

        <!-- ADMIN PANEL -->
        <div id="adminPanel" class="panel" style="display: none;">
            <h3>Dashboard For Admin</h3>
            <div class="managebtn">
                <button class="panelBtn protectedRoute">Manage Users</button>
                <button class="panelBtn protectedRoute">View Analytics</button>
            </div>
        </div>

        <!-- TEACHER PANEL -->
        <div id="teacherPanel" class="panel" style="display: none;">
            <h3>Dashboard For Teacher</h3>
            <div class="managebtn">
                <button class="panelBtn protectedRoute">Upload Course</button>
                <button class="panelBtn protectedRoute">View Student List</button>
            </div>
        </div>

        <!-- STUDENT PANEL -->
        <div id="studentPanel" class="panel" style="display: none;">
            <h3>Dashboard For Student</h3>
            <div class="managebtn">
                <button class="panelBtn protectedRoute">My Progress</button>
                <button class="panelBtn protectedRoute">My Courses</button>
            </div>
        </div>

    </div>

    <script src="home.js"></script>
</body>

</html>
